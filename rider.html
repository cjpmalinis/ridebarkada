<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideBarkada Rider</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><main class="app"><section class="screen">
<header class="topbar"><div><small>Rider Dashboard</small><strong id="name">Loading…</strong></div><button id="logout" class="iconbtn">↪</button></header>
<div id="notice" class="msg"></div>
<div class="card riderToggle"><span>Accepting rides</span><label class="switch"><input id="online" type="checkbox"><span></span></label></div>
<h2>Ride Requests</h2><div id="requests"><div class="empty">Loading…</div></div>
<h2>My Active Ride</h2><div id="active"><div class="empty">No active ride.</div></div>
</section></main>
<script>
const c=supabase.createClient(RB_CONFIG.SUPABASE_URL,RB_CONFIG.SUPABASE_ANON_KEY);let me;
const $=x=>document.getElementById(x);
async function init(){
 const {data:{user}}=await c.auth.getUser(); if(!user){location.href='index.html';return} me=user;
 const {data:p}=await c.from('profiles').select('*').eq('id',user.id).single(); $('name').textContent=p?.full_name||user.email;
 $('online').checked=!!p?.is_online;
 load();
 c.channel('requests').on('postgres_changes',{event:'*',schema:'public',table:'rides'},()=>load()).subscribe();
}
$('online').onchange=async()=>{await c.from('profiles').update({is_online:$('online').checked}).eq('id',me.id);};
$('logout').onclick=async()=>{await c.auth.signOut();location.href='index.html'};
async function load(){
 const {data,error}=await c.from('rides').select('*,passenger:profiles!passenger_id(full_name)').eq('status','requested').order('created_at',{ascending:true});
 if(error){$('requests').textContent=error.message;return}
 $('requests').innerHTML=data?.length?data.map(r=>`<div class="card ride"><strong>${esc(r.pickup_address)} → ${esc(r.destination_address)}</strong><p>Passenger: ${esc(r.passenger?.full_name||'Passenger')}</p><div class="fare"><span>Fare</span><strong>₱${Number(r.estimated_fare).toFixed(2)}</strong></div><button class="primary" onclick="acceptRide('${r.id}')">Accept Ride</button></div>`).join(''):'<div class="empty">No requests right now.</div>';
 const {data:a}=await c.from('rides').select('*,passenger:profiles!passenger_id(full_name)').eq('rider_id',me.id).in('status',['accepted','arriving','ongoing']).order('created_at',{ascending:false}).limit(1);
 $('active').innerHTML=a?.[0]?activeCard(a[0]):'<div class="empty">No active ride.</div>';
}
function activeCard(r){let next=r.status==='accepted'?'arriving':r.status==='arriving'?'ongoing':'completed';let label=next==='arriving'?'I’m Arriving':next==='ongoing'?'Start Ride':'Complete Ride';return `<div class="card ride"><strong>${esc(r.passenger?.full_name||'Passenger')}</strong><p>📍 ${esc(r.pickup_address)}</p><p>🏁 ${esc(r.destination_address)}</p><button class="primary" onclick="advance('${r.id}','${next}')">${label}</button></div>`}
async function acceptRide(id){const {error}=await c.from('rides').update({rider_id:me.id,status:'accepted',accepted_at:new Date().toISOString()}).eq('id',id).eq('status','requested');if(error)alert(error.message);load()}
async function advance(id,status){const patch={status};if(status==='completed')patch.completed_at=new Date().toISOString();const {error}=await c.from('rides').update(patch).eq('id',id).eq('rider_id',me.id);if(error)alert(error.message);load()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
init();
</script></body></html>
