<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideBarkada Rider</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"><style>body{font-family:Inter;background:#f5f7fa;margin:0;color:#101827}.wrap{max-width:900px;margin:50px auto;padding:20px}.head{background:#0b1220;color:#fff;border-radius:24px;padding:25px}.orange{color:#ff7a2f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.box,.req{background:#fff;border:1px solid #e7ebf0;border-radius:18px;padding:17px;margin:10px 0}.box b{font-size:23px;display:block;margin-top:5px}.req b{font-size:13px}.route{background:#f7f8fa;border-radius:13px;padding:13px;margin:12px 0;font-size:12px;line-height:2}.accept{background:#ff7a2f;color:#fff;padding:12px 18px;border-radius:12px;font-weight:800}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="head"><div class="orange">RIDER MODE</div><h2>Ready to ride, barkada?</h2><small>Turn online to receive nearby requests.</small></div><div class="stats"><div class="box">Today's rides<b>0</b></div><div class="box">Earnings<b>₱0</b></div><div class="box">Rating<b>—</b></div></div><h3>Nearby requests</h3><div id="list"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const s=supabase.createClient(RIDEBARKADA_CONFIG.SUPABASE_URL,RIDEBARKADA_CONFIG.SUPABASE_ANON_KEY);async function load(){let x=await s.from("rides").select("*").eq("status","requested").order("created_at",{ascending:false});list.innerHTML=(x.data||[]).map(r=>`<div class=req><b>New ride · ₱${r.estimated_fare}</b><div class=route>📍 ${r.pickup_address}<br>↓<br>🏁 ${r.destination_address}</div><button class=accept onclick="take('${r.id}')">Accept Ride</button></div>`).join("")||'<div class=req>No active requests.</div>}async function take(id){let u=await s.auth.getUser();if(!u.data.user)return alert("Sign in as a rider first.");await s.from("rides").update({rider_id:u.data.user.id,status:"accepted",accepted_at:new Date().toISOString()}).eq("id",id).eq("status","requested");load()}load()</script></body></html>
