<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>RideBarkada</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <main class="app">
    <section id="authView" class="screen">
      <div class="brand">
        <div class="logo">🏍️</div>
        <h1>RideBarkada</h1>
        <p>Motorcycle rides with your trusted riders.</p>
      </div>

      <div class="card">
        <h2 id="authTitle">Sign in</h2>
        <form id="authForm">
          <label>Email<input id="email" type="email" required placeholder="you@email.com"></label>
          <label>Password<input id="password" type="password" required minlength="6" placeholder="••••••••"></label>
          <label id="nameWrap" class="hidden">Full name<input id="fullName" placeholder="Juan Dela Cruz"></label>
          <button class="primary" id="authButton">Sign in</button>
        </form>
        <button class="linkbtn" id="toggleAuth">Create an account</button>
        <p id="authMsg" class="msg"></p>
      </div>
    </section>

    <section id="appView" class="screen hidden">
      <header class="topbar">
        <div>
          <small>Welcome</small>
          <strong id="userName">Rider</strong>
        </div>
        <button id="logout" class="iconbtn">↪</button>
      </header>

      <nav class="tabs">
        <button class="tab active" data-panel="homePanel">Book</button>
        <button class="tab" data-panel="ridesPanel">My Rides</button>
        <button class="tab" data-panel="profilePanel">Profile</button>
      </nav>

      <section id="homePanel" class="panel">
        <div class="hero">
          <span>🏍️</span>
          <div><h2>Where are you going?</h2><p>Request a ride from a registered rider.</p></div>
        </div>

        <form id="bookingForm" class="card">
          <label>Pickup location<input id="pickup" required placeholder="e.g. City Hall"></label>
          <label>Destination<input id="destination" required placeholder="e.g. Ligao Community College"></label>
          <label>Estimated distance (km)<input id="distance" type="number" min="0.1" step="0.1" value="3" required></label>
          <div class="fare">
            <span>Estimated fare</span><strong id="fare">₱50.00</strong>
          </div>
          <button class="primary">Request Ride</button>
          <p id="bookingMsg" class="msg"></p>
        </form>

        <div id="activeRide" class="card hidden"></div>
      </section>

      <section id="ridesPanel" class="panel hidden">
        <h2>My Rides</h2>
        <div id="ridesList"></div>
      </section>

      <section id="profilePanel" class="panel hidden">
        <h2>Profile</h2>
        <div class="card">
          <p><small>Name</small><strong id="profileName">—</strong></p>
          <p><small>Email</small><strong id="profileEmail">—</strong></p>
          <p><small>Role</small><strong id="profileRole">—</strong></p>
        </div>
      </section>
    </section>
  </main>

<script>
const cfg = window.RB_CONFIG;
const client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
let user = null, profile = null, signupMode = false, realtimeChannel = null;

const $ = id => document.getElementById(id);
const money = n => `₱${Number(n).toFixed(2)}`;

function setMsg(id, text, error=false) {
  const el=$(id); el.textContent=text; el.className='msg '+(error?'error':'success');
}
function fareFor(km) { return Math.max(50, 30 + Number(km)*12); }

$('distance').addEventListener('input', () => $('fare').textContent=money(fareFor($('distance').value)));

$('toggleAuth').onclick = () => {
  signupMode=!signupMode;
  $('authTitle').textContent=signupMode?'Create account':'Sign in';
  $('authButton').textContent=signupMode?'Create account':'Sign in';
  $('nameWrap').classList.toggle('hidden', !signupMode);
  $('toggleAuth').textContent=signupMode?'Already have an account? Sign in':'Create an account';
  $('authMsg').textContent='';
};

$('authForm').onsubmit = async e => {
  e.preventDefault();
  const email=$('email').value.trim(), password=$('password').value;
  if (signupMode) {
    const {data,error}=await client.auth.signUp({email,password});
    if(error) return setMsg('authMsg',error.message,true);
    if(data.user) {
      await client.from('profiles').upsert({id:data.user.id,full_name:$('fullName').value.trim()||'New User'});
    }
    setMsg('authMsg','Account created. If email confirmation is enabled, check your email.');
  } else {
    const {error}=await client.auth.signInWithPassword({email,password});
    if(error) return setMsg('authMsg',error.message,true);
    await loadApp();
  }
};

$('logout').onclick = async () => { await client.auth.signOut(); location.reload(); };

document.querySelectorAll('.tab').forEach(b => b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));
  b.classList.add('active'); $(b.dataset.panel).classList.remove('hidden');
  if(b.dataset.panel==='ridesPanel') loadRides();
});

$('bookingForm').onsubmit = async e => {
  e.preventDefault();
  if(!user) return;
  const km=Number($('distance').value), fare=fareFor(km);
  const {data,error}=await client.from('rides').insert({
    passenger_id:user.id,
    pickup_address:$('pickup').value.trim(),
    destination_address:$('destination').value.trim(),
    distance_km:km,
    estimated_fare:fare,
    status:'requested'
  }).select().single();
  if(error) return setMsg('bookingMsg',error.message,true);
  setMsg('bookingMsg','Ride requested. Waiting for a rider.');
  $('bookingForm').reset(); $('distance').value=3; $('fare').textContent=money(66);
  renderActive(data);
};

function renderActive(r) {
  $('activeRide').classList.remove('hidden');
  $('activeRide').innerHTML=`<div class="rideStatus"><span class="dot"></span><strong>${r.status.toUpperCase()}</strong></div>
  <p><small>Pickup</small><br>${escapeHtml(r.pickup_address)}</p>
  <p><small>Destination</small><br>${escapeHtml(r.destination_address)}</p>
  <div class="fare"><span>Fare</span><strong>${money(r.estimated_fare)}</strong></div>`;
}
async function loadRides() {
  const {data,error}=await client.from('rides').select('*,rider:profiles!rider_id(full_name)').eq('passenger_id',user.id).order('created_at',{ascending:false});
  if(error) return $('ridesList').innerHTML=`<div class="card error">${escapeHtml(error.message)}</div>`;
  $('ridesList').innerHTML=data.length?data.map(r=>`<div class="card ride">
    <div><strong>${escapeHtml(r.status.toUpperCase())}</strong><small>${new Date(r.created_at).toLocaleString()}</small></div>
    <p>📍 ${escapeHtml(r.pickup_address)}</p><p>🏁 ${escapeHtml(r.destination_address)}</p>
    <div class="fare"><span>Fare</span><strong>${money(r.estimated_fare)}</strong></div>
  </div>`).join(''):'<div class="empty">No rides yet.</div>';
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

async function loadApp() {
  const {data:{user:u}}=await client.auth.getUser(); user=u;
  if(!user) return;
  const {data:p}=await client.from('profiles').select('*').eq('id',user.id).single();
  profile=p;
  $('authView').classList.add('hidden'); $('appView').classList.remove('hidden');
  $('userName').textContent=p?.full_name||user.email;
  $('profileName').textContent=p?.full_name||'—'; $('profileEmail').textContent=user.email; $('profileRole').textContent=p?.role||'passenger';
  const {data:active}=await client.from('rides').select('*').eq('passenger_id',user.id).in('status',['requested','accepted','arriving','ongoing']).order('created_at',{ascending:false}).limit(1);
  if(active?.[0]) renderActive(active[0]);
  realtimeChannel=client.channel('ride-updates').on('postgres_changes',{event:'UPDATE',schema:'public',table:'rides',filter:`passenger_id=eq.${user.id}`},payload=>{
    renderActive(payload.new); loadRides();
  }).subscribe();
}
client.auth.getSession().then(({data})=>{ if(data.session) loadApp(); });
</script>
</body>
</html>
