<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideBarkada Admin</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"><style>body{font-family:Inter;background:#f5f7fa;margin:0}.wrap{max-width:1000px;margin:40px auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box,.ride{background:#fff;border:1px solid #e7ebf0;border-radius:17px;padding:17px;margin-top:10px}.box b{display:block;font-size:24px;margin-top:6px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><div class=wrap><b style="color:#ff7a2f">RIDEBARKADA ADMIN</b><h1>Operations dashboard</h1><p>Riders, customers, rides and self-drive rentals.</p><div class=cards><div class=box>Online riders<b id=a>—</b></div><div class=box>Customers<b id=b>—</b></div><div class=box>Active rides<b id=c>—</b></div><div class=box>Rental requests<b id=d>—</b></div></div><div id=list></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const s=supabase.createClient(RIDEBARKADA_CONFIG.SUPABASE_URL,RIDEBARKADA_CONFIG.SUPABASE_ANON_KEY);async function load(){let[p,r,q]=await Promise.all([s.from("profiles").select("role,is_online"),s.from("rides").select("*").in("status",["requested","accepted","arriving","ongoing"]),s.from("rental_bookings").select("id").eq("status","requested")]);a.textContent=(p.data||[]).filter(x=>x.role=="rider"&&x.is_online).length;b.textContent=(p.data||[]).filter(x=>x.role=="passenger").length;c.textContent=(r.data||[]).length;d.textContent=(q.data||[]).length;list.innerHTML=(r.data||[]).map(x=>`<div class=ride><b>${x.pickup_address} → ${x.destination_address}</b><br><small>${x.status} · ₱${x.estimated_fare}</small></div>`).join("")}load()</script></body></html>
