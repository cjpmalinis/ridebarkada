<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideBarkada Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><main class="app-shell"><section class="screen"><div class="brand-top"><div class="brand-mark">🏍</div><strong>RideBarkada</strong></div><header class="topbar" style="margin-top:20px"><div class="greeting"><small>Operations</small><strong>Admin Dashboard</strong></div><button id="logout" class="icon-btn">↪</button></header><div id="summary" class="stat-grid"></div><h2>Recent Rides</h2><div id="rides"></div><h2>Registered Users</h2><div id="users"></div></section></main><script>
const c=supabase.createClient(RB_CONFIG.SUPABASE_URL,RB_CONFIG.SUPABASE_ANON_KEY),$=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function init(){const {data:{user}}=await c.auth.getUser();if(!user)return location.href='index.html';const {data:p}=await c.from('profiles').select('*').eq('id',user.id).single();if(p?.role!=='admin')return document.querySelector('.screen').innerHTML='<div class="card"><h2>Access denied</h2><p>This account is not an administrator.</p></div>';load()}
$('logout').onclick=async()=>{await c.auth.signOut();location.href='index.html'};
async function load(){const {count:u}=await c.from('profiles').select('*',{count:'exact',head:true});const {count:r}=await c.from('rides').select('*',{count:'exact',head:true});const {count:a}=await c.from('rides').select('*',{count:'exact',head:true}).in('status',['requested','accepted','arriving','ongoing']);$('summary').innerHTML=`<div class="stat"><small>Users</small><strong>${u||0}</strong></div><div class="stat"><small>Total rides</small><strong>${r||0}</strong></div><div class="stat"><small>Active</small><strong>${a||0}</strong></div>`;const {data:rs}=await c.from('rides').select('*,passenger:profiles!passenger_id(full_name),rider:profiles!rider_id(full_name)').order('created_at',{ascending:false}).limit(30);$('rides').innerHTML=rs?.length?rs.map(x=>`<div class="card ride-item"><div class="ride-top"><strong>${x.status.toUpperCase()}</strong><span class="status">₱${Number(x.estimated_fare).toFixed(0)}</span></div><p>${esc(x.pickup_address)} → ${esc(x.destination_address)}</p><small>Passenger: ${esc(x.passenger?.full_name||'—')} · Rider: ${esc(x.rider?.full_name||'Unassigned')}</small></div>`).join(''):'<div class="empty">No rides yet.</div>';const {data:us}=await c.from('profiles').select('*').order('created_at',{ascending:false}).limit(50);$('users').innerHTML=us?.map(x=>`<div class="card"><strong>${esc(x.full_name)}</strong><p style="color:#6b7280">${x.role} ${x.is_online?'· 🟢 Online':''}</p></div>`).join('')||''}init();
</script></body></html>
